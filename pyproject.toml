[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-decision-lab"
version = "0.1.0"
description = "Offline-first evidence lab for bounded decision models"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2,<3",
  "typer>=0.12,<1",
  "PyYAML>=6,<7",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6"]
jev = ["typesafe-sdk"]

[project.scripts]
jev-lab = "jev_lab.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live_deepseek: requires a real DeepSeek credential and network",
  "live_jev: requires a real Jev credential and network",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["jev_lab"]
